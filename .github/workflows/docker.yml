# R107 (Oracle/Coolify migration): multi-arch Docker image for the openwa
# WhatsApp gateway (linux/amd64 + linux/arm64 → GHCR).
#
# This repo is PUBLIC → GitHub-hosted runners (including native arm64) are
# free and unmetered. The gateway image is tiny (npm ci + tsc, no Chromium —
# Baileys is pure WebSocket), so even QEMU-emulated arm64 builds stay quick.
#
# STATUS (r113): the publish path is PROVEN — sha-tagged multi-arch images
# are on GHCR (sha-d3f9a5d and earlier, published 2026-09-24/25). Native
# ARM64 RUNTIME verification (running the image on a real Ampere host)
# happens on the Oracle VM via the SubNation docker-verify harness +
# FINAL_CUTOVER_CHECKLIST, not in this workflow. (r113 fix: the push
# trigger's branch filter was malformed — 'ain]' instead of '[main]' —
# since the r110 edit. GitHub evidently ignored the invalid filter and
# ran the workflow on every push anyway, so publishing kept working;
# the fix scopes the trigger to main as intended instead of relying on
# that lenient fallback.)
name: Docker Image (multi-arch)

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tag scheme: immutable `sha-<short>` (one per commit — the
      # RECOMMENDED pull tag; the SubNation compose policy pins it, see
      # README § Docker), semver `X.Y.Z` + `latest` on `v*` tags, and the
      # FLOATING `main` branch alias. Pulls should be sha-pinned for
      # reproducible/rollback-able deployments.
      - name: Docker metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern=latest
            type=sha,prefix=sha-
            type=ref,event=branch

      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=multi-arch
          cache-to: type=gha,scope=multi-arch,mode=max
