# CI (FH-A12 F-6): the gateway's tests (7 files, node --test) previously
# ran only as a manual `npm test` — gateway drift could break SubNation's
# OTP login with no signal, because the SubNation backend consumes this
# repo's REST contract. This repo is PUBLIC → GitHub-hosted runners are free
# and unmetered, so a test job on every push/PR costs nothing.
#
# `npm test` = `npm run build && node --test tests/*.mjs`: the build step
# (tsc, strict) doubles as the typecheck — there is no separate typecheck or
# lint script in package.json. Tests are offline: no DATABASE_URL or live
# Postgres needed (persist-key-separation and persist-hardening reload
# dist/persist.js with PERSISTENCE_URL="" or a fake pool). Production parity:
# node 22 = the Dockerfile base
# (node:22-alpine); package manager = npm (package-lock.json, npm ci —
# same as the Dockerfile build stage).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install (lockfile-faithful)
        run: npm ci --no-audit --no-fund

      # O1-M3 (R111): supply-chain gate — the audit is clean as of R111
      # (qs 6.16.0 via express 4.22.3, sharp 0.35.4 past the libheif high);
      # this step keeps it that way: any future high+ advisory in a PROD
      # dependency fails CI instead of shipping silently.
      - name: Supply-chain audit (prod deps, high+)
        run: npm audit --omit=dev --audit-level=high

      - name: Build (tsc = typecheck) + tests (103 cases)
        run: npm test
